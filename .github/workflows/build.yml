
name: Build

# Concurrency scoped to the specific branch/ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  # Allow manual builds from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

# Permission to push generated builds
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.2
        with:
          path: src

      - name: Checkout Builds Branch
        uses: actions/checkout@v6.0.2
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE"/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Access Secrets & Create Properties
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE/src"

          touch local.properties

          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CASTLE_KEY=$CASTLE_KEY" >> local.properties
          echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN" >> local.properties
          echo "MOVIEBLAST_API=$MOVIEBLAST_API" >> local.properties
          echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY" >> local.properties

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"

          chmod +x gradlew
          ./gradlew make makePluginsJson

          # Copy generated plugin files
          find . -type f -path '*/build/*.cs3' \
            -exec cp -t "$GITHUB_WORKSPACE/builds/" {} + \
            || echo "No .cs3 files found"

          # Copy plugins.json if generated
          if [ -f build/plugins.json ]; then
            cp build/plugins.json "$GITHUB_WORKSPACE/builds/"
          else
            echo "No plugins.json found"
          fi

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Build $GITHUB_SHA"
            git push origin HEAD:builds
          else
            echo "No changes to push"
          fi
